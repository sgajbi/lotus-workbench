services:
  ci-local:
    build:
      context: .
      target: ci-tools
      labels:
        com.lotus.repository.checkout: "${PWD:?Docker Compose must resolve the Workbench checkout path}"
    working_dir: /app
    volumes:
      - ./:/app
      - ./scripts/testing/ci-empty.env:/app/.env.local:ro
      - ci-local-node-modules:/app/node_modules
      - ci-local-next-build-cache:/app/.next-build
    command:
      [
        "sh",
        "-lc",
        "npm config set fetch-retries 5 && npm config set fetch-retry-maxtimeout 120000 && npm config set fetch-timeout 300000 && npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm run test -- --maxWorkers=2 && npm run build"
      ]
    environment:
      - BFF_BASE_URL=http://host.docker.internal:8100
      - LOTUS_ENVIRONMENT=test
      - WORKBENCH_IDEA_AUTH_MODE=development_configured
      - WORKBENCH_DEPLOYMENT_ID=local-ci-parity

volumes:
  ci-local-node-modules:
  ci-local-next-build-cache:
