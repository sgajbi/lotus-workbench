name: Merged PR Main Releasability Dispatch

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: write

jobs:
  dispatch-main-releasability:
    name: Dispatch Main Releasability
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Rebase merging can land more than one revision. The dispatcher must
          # be able to enumerate the complete accepted history, not only its tip.
          fetch-depth: 0
      - name: Dispatch main releasability gate for every merged revision
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_COMMIT_SHA" ]; then
            echo "::error::pull_request.merge_commit_sha is required for exact-main releasability dispatch"
            exit 1
          fi
          if ! [[ "$COMMIT_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pull_request.commits must be a positive integer; received '$COMMIT_COUNT'"
            exit 1
          fi

          # Revision enumeration is valid only while this repository permits
          # rebase merging and refuses squash and merge commits. Fail closed if
          # that operator-controlled premise changes.
          merge_methods="$(gh api "repos/$GITHUB_REPOSITORY" \
            --jq '[.allow_squash_merge, .allow_merge_commit, .allow_rebase_merge] | @csv')"
          if [ "$merge_methods" != "false,false,true" ]; then
            echo "::error::Merge methods changed ($merge_methods); per-revision dispatch assumes rebase-only merging."
            exit 1
          fi

          git fetch origin main --quiet
          git checkout --quiet --detach FETCH_HEAD
          mapfile -t revisions < <(git rev-list -n "$COMMIT_COUNT" "$MERGE_COMMIT_SHA" | tac)
          if [ "${#revisions[@]}" -ne "$COMMIT_COUNT" ]; then
            echo "::error::Expected $COMMIT_COUNT revisions for PR #$PR_NUMBER, enumerated ${#revisions[@]}."
            exit 1
          fi
          if [ "${revisions[-1]}" != "$MERGE_COMMIT_SHA" ]; then
            echo "::error::Enumerated tip ${revisions[-1]} does not match merged PR tip $MERGE_COMMIT_SHA."
            exit 1
          fi

          for revision in "${revisions[@]}"; do
            if ! git merge-base --is-ancestor "$revision" HEAD; then
              echo "::error::Revision $revision is not reachable from current main; refusing to dispatch."
              exit 1
            fi
            existing_ref_sha=""
            dispatch_ref="main-releasability-${revision}"
            if existing_ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$dispatch_ref" --jq .object.sha 2>/dev/null)"; then
              if [ "$existing_ref_sha" != "$revision" ]; then
                echo "::error::Dispatch ref $dispatch_ref points to $existing_ref_sha, expected $revision"
                exit 1
              fi
            fi
            if [ -z "$existing_ref_sha" ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$dispatch_ref" \
                -f sha="$revision" >/dev/null
            fi
            gh workflow run main-releasability.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$dispatch_ref" \
              -f expected_sha="$revision" \
              -f triggering_pr="$PR_NUMBER"
            echo "Dispatched main releasability for $revision (PR #$PR_NUMBER)"
          done
