name: Main Releasability Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional merged pull-request SHA that this run must validate."
        required: false
        type: string
      triggering_pr:
        description: "Optional pull request number that dispatched this mainline validation."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.expected_sha || github.sha }}
  # A releasability run is durable evidence for one exact main revision. A
  # duplicate dispatch must queue rather than erase an in-flight verdict.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exact-revision-assertion:
    name: Main Releasability / Exact Revision Assertion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert expected merged PR SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No expected_sha input supplied; treating this as an operator-dispatched main releasability run."
            exit 0
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Main releasability checkout SHA $actual_sha does not match expected merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::Expected SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown} is not reachable from origin/main."
            exit 1
          fi

  workflow-lint:
    name: Main Releasability / Workflow Lint
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  quality-gate:
    name: Main Releasability / Lint Typecheck Coverage Build
    needs: [workflow-lint]
    runs-on: ubuntu-latest
    env:
      WORKBENCH_DEPLOYMENT_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: "npm"
      - name: Install
        run: make install
      - name: Canonical Runtime Ownership Contracts
        run: make test-runtime-ownership
      - name: Dependency Security Gate
        run: make security
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Coverage Gate
        run: make test-coverage
      - name: Build
        run: make build
      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-coverage-report
          path: |
            coverage
          if-no-files-found: error

  e2e-smoke:
    name: Main Releasability / Fixture-Free Playwright Smoke
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKBENCH_DEPLOYMENT_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: "npm"
      - name: Install
        run: make install
      - name: Install Playwright Browsers
        run: node node_modules/playwright/cli.js install chromium
      - name: Run Playwright Smoke
        run: make test-e2e
      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  e2e-fixture-scenarios:
    name: Main Releasability / Fixture Scenarios / ${{ matrix.family }}
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [portfolio, performance, manage, reports]
    env:
      WORKBENCH_DEPLOYMENT_ID: ${{ github.sha }}
      WORKBENCH_E2E_FIXTURE_FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: "npm"
      - name: Install
        run: make install
      - name: Install Playwright Browsers
        run: node node_modules/playwright/cli.js install chromium
      - name: Run Exact Fixture Scenario Family
        run: npm run test:e2e:fixtures
      - name: Upload Fixture Scenario Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-fixture-scenario-${{ matrix.family }}
          path: output/e2e-scenario-results/${{ matrix.family }}
          if-no-files-found: error

  browser-proof-gate:
    name: Main Releasability / Browser Proof
    needs: [e2e-smoke, e2e-fixture-scenarios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIXTURE_RESULT: ${{ needs.e2e-fixture-scenarios.result }}
      SMOKE_RESULT: ${{ needs.e2e-smoke.result }}
    steps:
      - name: Enforce Complete Browser Proof
        run: |
          if [ "$SMOKE_RESULT" != "success" ] || [ "$FIXTURE_RESULT" != "success" ]; then
            echo "Fixture-free smoke: $SMOKE_RESULT"
            echo "Exact fixture scenarios: $FIXTURE_RESULT"
            exit 1
          fi

  docker-build:
    name: Main Releasability / Docker Build And Security
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: lotus-workbench-scale-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
      - name: Build image
        run: docker build --label "com.lotus.repository.checkout=${{ github.workspace }}" --build-arg WORKBENCH_DEPLOYMENT_ID="${{ github.sha }}" -t lotus-workbench:ci-test .
      - name: Reject fixable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: lotus-workbench:ci-test
          version: v0.69.3
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Build patched scale-proof load balancer
        run: docker build --label "com.lotus.repository.checkout=${{ github.workspace }}" --file scripts/scale/Dockerfile.balancer --tag lotus-workbench-scale-balancer:ci-test .
      - name: Reject fixable high and critical load-balancer vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: lotus-workbench-scale-balancer:ci-test
          version: v0.69.3
          skip-setup-trivy: true
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Two-replica replacement and capacity regression proof
        env:
          SCALE_PROOF_SKIP_BUILD: "1"
          WORKBENCH_DEPLOYMENT_ID: ${{ github.sha }}
          WORKBENCH_SCALE_IMAGE: lotus-workbench:ci-test
          WORKBENCH_SCALE_BALANCER_IMAGE: lotus-workbench-scale-balancer:ci-test
        run: node scripts/scale/run-workbench-scale-proof.mjs
      - name: Upload scale-proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-main-scale-proof
          path: output/scale-proof
          if-no-files-found: warn
      - name: Generate production image SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: lotus-workbench:ci-test
          version: v0.69.3
          skip-setup-trivy: true
          format: cyclonedx
          output: workbench-image.cdx.json
          exit-code: "0"
          ignore-unfixed: false
          scanners: vuln
          vuln-type: os,library
      - name: Upload production image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: workbench-main-production-image-sbom
          path: workbench-image.cdx.json
          if-no-files-found: error

  ci-local-docker:
    name: Main Releasability / CI Local Docker Parity
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: lotus-workbench-parity-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - name: Dockerized Local CI Parity
        run: make ci-local-docker
      - name: Cleanup
        if: always()
        run: make ci-local-docker-down
