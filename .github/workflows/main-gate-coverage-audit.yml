name: Main Gate Coverage Audit

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Audit / Every Main Commit Has A Gate Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Audit main gate coverage (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python scripts/audit_main_gate_coverage.py \
            --baseline 43f9335b8ca5e903a0fab848b248d54132db0ad6 \
            --fail-on-gap
      - name: Compare live branch protection against policy (fail closed)
        if: ${{ !cancelled() }}
        env:
          # The workflow token cannot read branch protection. This intentionally
          # fails closed until an administration:read repository token is approved.
          GH_TOKEN: ${{ secrets.LOTUS_AUTOMERGE_TOKEN }}
        run: |
          node scripts/quality/check-branch-protection-policy-document.mjs
          python scripts/check_branch_protection_policy.py
