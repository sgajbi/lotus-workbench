services:
  lotus-workbench:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        com.lotus.repository.checkout: "${PWD:?Docker Compose must resolve the Workbench checkout path}"
      args:
        WORKBENCH_DEPLOYMENT_ID: ${WORKBENCH_DEPLOYMENT_ID:-local-development}
    image: lotus-workbench:latest
    ports:
      - "3000:3000"
    environment:
      - BFF_BASE_URL=${BFF_BASE_URL:-http://host.docker.internal:8100}
      - LOTUS_ENVIRONMENT=${LOTUS_ENVIRONMENT:-dev}
      - WORKBENCH_DEPLOYMENT_ID=${WORKBENCH_DEPLOYMENT_ID:-local-development}
      - WORKBENCH_BFF_TENANT_ID=${WORKBENCH_BFF_TENANT_ID:-tenant-sg}
      - WORKBENCH_DPM_COMMAND_CENTER_TENANT_ID=${WORKBENCH_DPM_COMMAND_CENTER_TENANT_ID:-default}
      - WORKBENCH_DPM_COMMAND_CENTER_PORTFOLIO_MANAGER_ID=${WORKBENCH_DPM_COMMAND_CENTER_PORTFOLIO_MANAGER_ID:-PM_SG_DPM_001}
      - WORKBENCH_DPM_COMMAND_CENTER_BOOK_ID=${WORKBENCH_DPM_COMMAND_CENTER_BOOK_ID:-BOOK_SG_BALANCED_DPM}
      - WORKBENCH_DPM_COMMAND_CENTER_AS_OF_DATE=${WORKBENCH_DPM_COMMAND_CENTER_AS_OF_DATE:-2026-05-03}
      - WORKBENCH_IDEA_AUTH_MODE=${WORKBENCH_IDEA_AUTH_MODE:-development_configured}
      - WORKBENCH_IDEA_CALLER_SUBJECT=${WORKBENCH_IDEA_CALLER_SUBJECT:-workbench-advisor}
      - WORKBENCH_IDEA_CALLER_ROLES=${WORKBENCH_IDEA_CALLER_ROLES:-advisor}
      - WORKBENCH_IDEA_CALLER_TENANT_IDS=${WORKBENCH_IDEA_CALLER_TENANT_IDS:-tenant-sg}
      - WORKBENCH_IDEA_CALLER_BOOK_IDS=${WORKBENCH_IDEA_CALLER_BOOK_IDS:-BOOK_SG_BALANCED_DPM}
      - WORKBENCH_IDEA_CALLER_PORTFOLIO_IDS=${WORKBENCH_IDEA_CALLER_PORTFOLIO_IDS:-PB_SG_GLOBAL_BAL_001}
      - WORKBENCH_IDEA_CALLER_CLIENT_IDS=${WORKBENCH_IDEA_CALLER_CLIENT_IDS:-CLIENT_SCOPE_PB_SG_GLOBAL_BAL_001}
      - WORKBENCH_ADVISOR_COCKPIT_AUTH_MODE=${WORKBENCH_ADVISOR_COCKPIT_AUTH_MODE:-development_configured}
      - WORKBENCH_ADVISOR_COCKPIT_ACTOR_ID=${WORKBENCH_ADVISOR_COCKPIT_ACTOR_ID:-advisor_sg_001}
      - WORKBENCH_ADVISOR_COCKPIT_TENANT_ID=${WORKBENCH_ADVISOR_COCKPIT_TENANT_ID:-tenant-sg}
      - WORKBENCH_ADVISOR_COCKPIT_REGION=${WORKBENCH_ADVISOR_COCKPIT_REGION:-APAC}
      - WORKBENCH_ADVISOR_COCKPIT_BOOKING_CENTER_CODE=${WORKBENCH_ADVISOR_COCKPIT_BOOKING_CENTER_CODE:-SG}
      - WORKBENCH_ADVISOR_COCKPIT_LEGAL_ENTITY_CODE=${WORKBENCH_ADVISOR_COCKPIT_LEGAL_ENTITY_CODE:-SGPB}
      - WORKBENCH_ADVISOR_COCKPIT_PRINCIPAL_STATUS=${WORKBENCH_ADVISOR_COCKPIT_PRINCIPAL_STATUS:-ACTIVE}
      - WORKBENCH_ADVISOR_COCKPIT_PORTFOLIO_IDS=${WORKBENCH_ADVISOR_COCKPIT_PORTFOLIO_IDS:-PB_SG_GLOBAL_BAL_001}
